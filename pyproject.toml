[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "0.1.0"
description = "Multi-threaded TCP port scanner with banner grabbing and CVE lookup"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["port-scanner", "security", "network", "cve"]

authors = [
    {name = "Gara", email = "gara@example.com"},
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

]

dependencies = [
    "aiohttp>=3.9,<4",
    "tqdm>=4.64,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.0,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
port-scanner = "portScanner.cli:main"

[tool.ruff]
target-version = "py39"
line-length = 120
lint.select = ["E", "F", "W", "I", "N"]
lint.ignore = ["N818", "N999"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.setuptools]
packages = ["portScanner"]
