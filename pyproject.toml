[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "0.1.0"
description = "Multi-threaded TCP port scanner with banner grabbing and CVE lookup"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["port-scanner", "security", "network", "cve"]

authors = [
    {name = "Gara", email = "gara@example.com"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.scripts]
port-scanner = "portScanner:main"

[tool.setuptools]
py-modules = ["portScanner"]
